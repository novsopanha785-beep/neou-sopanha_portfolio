<div class="qc">
  @if (open()) {
    <div class="qc__panel card">
      <a [href]="telegramUrl" target="_blank" rel="noopener" class="qc__item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 4.3 18.7 20c-.24 1.06-.87 1.32-1.76.82l-4.86-3.58-2.35 2.26c-.26.26-.48.48-.98.48l.35-4.95L18.3 6.5c.4-.36-.09-.56-.62-.2L6.5 13.4l-4.83-1.5c-1.05-.33-1.07-1.05.22-1.55L20.6 3.14c.87-.32 1.63.2 1.3 1.16Z"/></svg>
        Chat on Telegram
      </a>
      <a [href]="phoneHref" class="qc__item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 3a2 2 0 0 1-.5 2.1L8 10.2a16 16 0 0 0 6 6l1.4-1.3a2 2 0 0 1 2.1-.5c1 .3 2 .5 3 .7a2 2 0 0 1 1.5 2Z" stroke="currentColor" stroke-width="2"/></svg>
        Call {{ phoneDisplay }}
      </a>
    </div>
  }

  <button type="button" class="qc__trigger" [class.is-open]="open()" (click)="toggle()">
    @if (open()) {
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      Close
    } @else {
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M21 11.5a8.4 8.4 0 0 1-8.9 8.4 8.7 8.7 0 0 1-3.8-.9L3 20l1.1-5a8.3 8.3 0 0 1-1.1-4.2A8.4 8.4 0 0 1 12 3.1a8.5 8.5 0 0 1 9 8.4Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      Quick Contact
    }
  </button>
</div>
