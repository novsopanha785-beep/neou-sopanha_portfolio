<header class="nav" [class.nav--scrolled]="scrolled()">
  <div class="nav__inner">
    <a href="#home" class="nav__brand" (click)="goTo('home'); $event.preventDefault()">
      <!-- <span class="nav__avatar">
        NS
        <i class="nav__avatar-dot"></i>
      </span> -->
      <span class="nav__avatar">
        <img src="assets/Neousopanha.jpg" alt="Profile">
        <i class="nav__avatar-dot"></i>
      </span>
      <span class="nav__name">Neou Sopanha</span>
    </a>

    <nav class="nav__links" aria-label="Primary">
      @for (link of links; track link.id) {
        <a
          [href]="'#' + link.id"
          class="nav__link"
          [class.is-active]="activeId() === link.id"
          (click)="goTo(link.id); $event.preventDefault()"
        >
          {{ link.label }}
        </a>
      }
    </nav>

    <div class="nav__actions">
      <button type="button" class="nav__icon-btn nav__search" aria-label="Search" (click)="search.show()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m21 21-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Search</span>
        <kbd>⌘K</kbd>
      </button>

      <button type="button" class="nav__icon-btn nav__icon-btn--square nav__search-mobile" aria-label="Search" (click)="search.show()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m21 21-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>

      <button type="button" class="nav__icon-btn nav__icon-btn--square" aria-label="Ask AI" (click)="chat.show()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 2 9.5 9.5 2 12l7.5 2.5L12 22l2.5-7.5L22 12l-7.5-2.5z" fill="currentColor"/></svg>
      </button>

      <button type="button" class="nav__icon-btn nav__icon-btn--square" aria-label="Toggle theme" (click)="toggleTheme()">
        @if (isLight()) {
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        } @else {
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        }
      </button>

      <a href="assets/Neou Sopanha-CV.pdf" download class="btn btn-primary nav__resume">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Resume
      </a>

      <button type="button" class="nav__burger" [class.is-open]="menuOpen()" (click)="toggleMenu()" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <nav class="nav__mobile" aria-label="Mobile">
      @for (link of links; track link.id) {
        <a
          [href]="'#' + link.id"
          class="nav__mobile-link"
          [class.is-active]="activeId() === link.id"
          (click)="goTo(link.id); $event.preventDefault()"
        >
          {{ link.label }}
        </a>
      }
      <a href="assets/Neou Sopanha-CV.pdf" download class="btn btn-primary" (click)="closeMenu()">Download Resume</a>
    </nav>
  }
</header>
